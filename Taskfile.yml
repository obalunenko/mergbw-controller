version: '3'

vars:
  GO: '{{default "go" .GO}}'
  PYTHON: '{{default "python3" .PYTHON}}'
  PACKAGE_MODE: '{{default "development" .PACKAGE_MODE}}'
  NATIVE_ARM64_DIR: '{{default (printf "%s/dist/plugin-native/darwin_arm64" .ROOT_DIR) .NATIVE_ARM64_DIR}}'
  NATIVE_AMD64_DIR: '{{default (printf "%s/dist/plugin-native/darwin_amd64" .ROOT_DIR) .NATIVE_AMD64_DIR}}'
  DATA_DIR: '{{default .ROOT_DIR .MERGBW_DATA_DIR}}'
  CORE_PACKAGES: ./internal/protocol ./internal/config ./internal/logging ./internal/controller ./internal/bridge ./internal/ble ./internal/managed ./cmd/sunset/supervisor
  SPECKIT_INSTALL: scripts/install-speckit.sh
  SPECKIT_UPDATE_CHECK: scripts/check-speckit-updates.py
  SPECKIT_VERSION: '1.1.3'
  SPECKIT_COMPANION_VERSION: '0.25.0'
  SPECKIT_BROWNFIELD_VERSION: '1.0.0'
  SPECKIT_BUGFIX_VERSION: '1.1.0'
  SPECKIT_FEATURE_NUMBERING_VERSION: '1.0.0'

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  build:
    desc: Build the controller for the current platform.
    cmds:
      - '{{.GO}} build -trimpath -buildvcs=false -o sunset ./cmd/sunset'

  release:archive:
    desc: Build a native controller release archive in dist (requires RELEASE_TAG=vX.Y.Z).
    requires:
      vars: [RELEASE_TAG]
    cmds:
      - task: build
      - '{{.PYTHON}} scripts/release.py archive --tag {{shellQuote .RELEASE_TAG}} --go {{shellQuote .GO}}'

  release:notes:
    desc: Generate release notes from local tags and history (requires RELEASE_TAG and RELEASE_REPOSITORY=owner/repo).
    requires:
      vars: [RELEASE_TAG, RELEASE_REPOSITORY]
    cmds:
      - '{{.PYTHON}} scripts/release.py notes --tag {{shellQuote .RELEASE_TAG}} --repository {{shellQuote .RELEASE_REPOSITORY}} --output dist/release-notes.md'

  release:test:
    desc: Check release history selection and archive contents without network or Bluetooth.
    cmds:
      - '{{.PYTHON}} scripts/test_release.py'

  tools:
    desc: Install pinned development tools through the Make bootstrap.
    cmds:
      - 'make tools GO="{{.GO}}"'

  deps:
    desc: Download application dependencies.
    cmds:
      - '{{.GO}} mod download'

  setup:
    desc: Download dependencies, build, and initialize settings (first use requires -- --identity VALUE).
    preconditions:
      - sh: 'test "$(uname -s)" != Darwin || (xcode-select -p >/dev/null 2>&1 && xcrun --find clang >/dev/null 2>&1 && xcrun --sdk macosx --show-sdk-path >/dev/null 2>&1)'
        msg: Install Xcode Command Line Tools and select a working macOS SDK before running task setup on macOS.
    cmds:
      - task: deps
      - task: init
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'

  init:
    desc: Build and initialize missing settings and Stream Deck URLs.
    deps: [build]
    cmds:
      - './sunset --data-dir {{shellQuote .DATA_DIR}} {{.CLI_ARGS}} init'

  run:
    aliases: [serve]
    desc: Build and run the controller in the foreground (Ctrl+C to stop).
    deps: [build]
    cmds:
      - './sunset --data-dir {{shellQuote .DATA_DIR}} {{.CLI_ARGS}} serve'

  urls:
    desc: Build, regenerate, and print Stream Deck URLs (contains the access token).
    deps: [build]
    cmds:
      - './sunset --data-dir {{shellQuote .DATA_DIR}} urls'

  inspect:
    desc: Build and inspect the real lamp without lighting commands (stop run first).
    deps: [build]
    cmds:
      - './sunset --data-dir {{shellQuote .DATA_DIR}} inspect'

  send:
    desc: Build and send an HTTP command to the running controller (e.g. -- color FF5000).
    deps: [build]
    cmds:
      - './sunset --data-dir {{shellQuote .DATA_DIR}} send {{.CLI_ARGS}}'

  dry-run:
    desc: Build and print command packets without sending them (e.g. -- preset sunset).
    deps: [build]
    cmds:
      - './sunset --data-dir {{shellQuote .DATA_DIR}} dry-run {{.CLI_ARGS}}'

  version:
    desc: Build and print the controller version.
    deps: [build]
    cmds:
      - './sunset --version'

  workflows:test:
    desc: Check Task workflow ordering and argument forwarding without native Bluetooth.
    cmds:
      - '{{.PYTHON}} scripts/test_task_workflows.py'

  # Hardware tests are excluded unless the explicit hardware tag is enabled.
  # Native-only packages have no default test binaries to initialize Bluetooth.
  test:
    desc: Run all default tests without Bluetooth hardware.
    cmds:
      - '{{.GO}} test ./...'

  test:core:
    desc: Test core packages without initializing Bluetooth.
    cmds:
      - '{{.GO}} test {{.CORE_PACKAGES}}'

  test:race:
    desc: Check core packages with the race detector.
    cmds:
      - '{{.GO}} test -race {{.CORE_PACKAGES}}'

  test:hardware:
    desc: Locally inspect and send commands to the real lamp using DATA_DIR (never runs in CI).
    preconditions:
      - sh: 'test -z "$CI"'
        msg: Hardware integration tests run only locally, outside CI.
      - sh: 'data_dir={{shellQuote .DATA_DIR}}; test -f "$data_dir/settings.json" && test -f "$data_dir/presets.json"'
        msg: Run task setup first, or set MERGBW_DATA_DIR to a directory containing settings.json and presets.json.
    cmds:
      - 'MERGBW_DATA_DIR={{shellQuote .DATA_DIR}} {{.GO}} test -count=1 -tags=hardware -timeout=15m -v ./internal/ble/native'

  mocks:generate:
    desc: Regenerate unit-test mocks using the pinned mockgen tool module.
    cmds:
      - '{{.GO}} tool -modfile=tools/mockgen/go.mod mockgen -source=internal/config/managed_config.go -destination=internal/config/mock_managed_store_test.go -package=config'
      - '{{.GO}} tool -modfile=tools/mockgen/go.mod mockgen -source=internal/managed/interfaces.go -destination=internal/managed/mock_runtime_test.go -package=managed'
      - '{{.GO}} tool -modfile=tools/mockgen/go.mod mockgen -source=internal/controller/controller.go -destination=internal/controller/mock_link_test.go -package=controller'
      - '{{.GO}} tool -modfile=tools/mockgen/go.mod mockgen -source=internal/bridge/http.go -destination=internal/bridge/mock_controller_test.go -package=bridge_test'
      - '{{.GO}} tool -modfile=tools/mockgen/go.mod mockgen -destination=internal/bridge/mock_transition_controller_test.go -package=bridge_test github.com/obalunenko/mergbw-controller/internal/bridge TransitionController'
      - '{{.GO}} tool -modfile=tools/mockgen/go.mod mockgen -source=internal/controller/controller.go -destination=internal/bridge/mock_link_test.go -package=bridge_test'
      - '{{.GO}} tool -modfile=tools/mockgen/go.mod mockgen -destination=internal/bridge/mock_response_writer_test.go -package=bridge_test net/http ResponseWriter'
      - '{{.GO}} tool -modfile=tools/mockgen/go.mod mockgen -source=internal/ble/transport.go -destination=internal/ble/mock_transport_test.go -package=ble'

  vet:
    desc: Vet all Go packages.
    cmds:
      - '{{.GO}} vet ./...'

  speckit:install:
    desc: Install pinned Spec Kit and all project extensions.
    env:
      SPECKIT_VERSION: '{{.SPECKIT_VERSION}}'
      SPECKIT_COMPANION_VERSION: '{{.SPECKIT_COMPANION_VERSION}}'
      SPECKIT_BROWNFIELD_VERSION: '{{.SPECKIT_BROWNFIELD_VERSION}}'
      SPECKIT_BUGFIX_VERSION: '{{.SPECKIT_BUGFIX_VERSION}}'
      SPECKIT_FEATURE_NUMBERING_VERSION: '{{.SPECKIT_FEATURE_NUMBERING_VERSION}}'
    cmds:
      - 'bash {{.SPECKIT_INSTALL}}'

  speckit:update:check:
    desc: Check for Spec Kit and Companion updates without installing them.
    env:
      SPECKIT_VERSION: '{{.SPECKIT_VERSION}}'
      SPECKIT_COMPANION_VERSION: '{{.SPECKIT_COMPANION_VERSION}}'
      SPECKIT_BROWNFIELD_VERSION: '{{.SPECKIT_BROWNFIELD_VERSION}}'
      SPECKIT_BUGFIX_VERSION: '{{.SPECKIT_BUGFIX_VERSION}}'
      SPECKIT_FEATURE_NUMBERING_VERSION: '{{.SPECKIT_FEATURE_NUMBERING_VERSION}}'
    cmds:
      - '{{.PYTHON}} {{.SPECKIT_UPDATE_CHECK}}'

  speckit:update:test:
    desc: Run the network-free Spec Kit update-checker regression tests.
    cmds:
      - '{{.PYTHON}} scripts/test_check_speckit_updates.py'

  # Intended for Linux CI; the macOS job only builds the executable.
  check:
    desc: Run tests, race checks, vet, and build.
    cmds:
      - task: test
      - task: test:race
      - task: vet
      - task: build

  plugin:deps:
    desc: Install locked local Stream Deck dependencies (Node 24).
    dir: streamdeck
    cmds:
      - npm ci

  plugin:lint:
    desc: Check plugin lint and formatting without modifying files.
    dir: streamdeck
    cmds:
      - npm run lint
      - npm run format:check

  plugin:typecheck:
    desc: Type-check the plugin backend and inspector.
    dir: streamdeck
    cmds:
      - npm run typecheck

  plugin:test:
    desc: Test the plugin with facades and synthetic loopback fixtures.
    dir: streamdeck
    cmds:
      - npm test

  plugin:build:
    desc: Bundle the plugin and inspector without launching Stream Deck.
    dir: streamdeck
    cmds:
      - npm run build

  plugin:validate:
    desc: Validate the built plugin with the pinned local CLI.
    dir: streamdeck
    cmds:
      - npm run validate

  plugin:check:software:
    desc: Run BLE-free software and payload fixture checks without native artifacts or credentials.
    dir: streamdeck
    cmds:
      - task: plugin:lint
      - task: plugin:typecheck
      - task: plugin:test
      - task: plugin:build
      - task: plugin:validate
      - npm run check:package:software
      - '{{.PYTHON}} ../scripts/test_plugin_native.py'

  plugin:native:build:
    desc: Compile and inspect current-Mac slices without executing native code.
    env:
      GO: '{{.GO}}'
    cmds:
      - '{{.PYTHON}} scripts/plugin-native.py build --output-root {{shellQuote (printf "%s/dist" .ROOT_DIR)}}'

  plugin:native:assemble:
    desc: Assemble matching arm64 and Intel slices into an isolated universal app.
    cmds:
      - '{{.PYTHON}} scripts/plugin-native.py assemble --arm64-dir {{shellQuote .NATIVE_ARM64_DIR}} --amd64-dir {{shellQuote .NATIVE_AMD64_DIR}}'

  plugin:native:dev:
    desc: Mark and ad-hoc sign an assembled two-architecture development payload.
    cmds:
      - '{{.PYTHON}} scripts/plugin-native.py dev'

  plugin:native:sign:
    desc: Sign/notarize/staple the assembled distribution payload; requires explicit credentials.
    cmds:
      - '{{.PYTHON}} scripts/plugin-native.py sign'

  plugin:check:
    desc: Check software plus the complete staged native payload (development by default).
    dir: streamdeck
    env:
      PACKAGE_MODE: '{{.PACKAGE_MODE}}'
    cmds:
      - task: plugin:check:software
      - npm run check:package

  plugin:package:
    desc: Check then author and inspect the complete installer in root dist.
    dir: streamdeck
    env:
      PACKAGE_MODE: '{{.PACKAGE_MODE}}'
    cmds:
      - task: plugin:check
        vars:
          PACKAGE_MODE: '{{.PACKAGE_MODE}}'
      - npm run package

  plugin:link:
    env:
      PACKAGE_MODE: '{{.PACKAGE_MODE}}'
    desc: Explicitly validate and link the complete staged plugin to the local macOS host.
    dir: streamdeck
    cmds:
      - npm run check:package
      - npm run link

  plugin:watch:
    env:
      PACKAGE_MODE: '{{.PACKAGE_MODE}}'
    desc: Explicitly watch builds and restart an already linked plugin.
    dir: streamdeck
    cmds:
      - npm run check:package
      - npm run watch

  plugin:mock:
    desc: Explicitly start the synthetic controller on 127.0.0.1:18766 (no BLE).
    dir: streamdeck
    cmds:
      - 'node scripts/mock-bridge.mjs {{.CLI_ARGS}}'
