name: CI

"on":
  push:
    tags-ignore: ["**"] # Tag checks are called by release.yml.
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exercise the selected Go version instead of silently upgrading it.
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "1"

jobs:
  linux:
    name: Linux / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27.x", "stable"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go for tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/task/go.mod
          cache-dependency-path: tools/task/go.sum
      - name: Install pinned repository tools
        run: make tools
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Run all tests without Bluetooth hardware
        run: task test
      - name: Check core concurrency with the race detector
        run: task test:race
      - name: Vet all packages
        run: task vet
      - name: Build Linux controller
        run: task build
      - name: Check release tooling without Bluetooth
        run: task release:test

  macos:
    name: macOS / CoreBluetooth build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go for tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/task/go.mod
          cache-dependency-path: tools/task/go.sum
      - name: Install pinned repository tools
        run: make tools
      - name: Set up minimum Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Importing the native BLE package at runtime can prompt for Bluetooth
      # access. Compile/link with CGO here; do not run the binary or BLE tests.
      - name: Build macOS controller with CGO
        run: task build
